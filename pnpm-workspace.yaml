packages:
  - 'apps/*'
  - 'packages/*'

# Hoist all dependencies to root node_modules so Metro/Expo autolinking can find them.
# CRITICAL: these directives MUST live here, not in `.npmrc`.
# pnpm (>=9.x on EAS workers) reads `hoistPattern`, `publicHoistPattern`, and
# `shamefullyHoist` ONLY from `pnpm-workspace.yaml`. Putting them in `.npmrc`
# is silently ignored, which causes:
#   "Failed to resolve plugin for module 'expo-secure-store'"
# during `expo prebuild`. See DEBUG_PLAN.md §1.2 / §1.3.
shamefullyHoist: true
hoistPattern:
  - '*'
publicHoistPattern:
  - '*'
