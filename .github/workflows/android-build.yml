name: Android APK CI

on:
  push:
    branches: [ "build-backup", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Expo Prebuild
        working-directory: apps/staff-app
        run: npx expo prebuild --platform android --clean

      - name: Patch Android Native (Full-Screen Intent, WakeLock, Foreground Service, Alarm Sound)
        working-directory: apps/staff-app
        run: node patch-android.js

      - name: Build Standalone Android Release APK
        working-directory: apps/staff-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffApp-Release-APK
          path: apps/staff-app/android/app/build/outputs/apk/release/app-release.apk
