name: Android APK CI

on:
  push:
    branches: [ "build-backup", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Expo Prebuild
        working-directory: apps/staff-app
        run: npx expo prebuild --platform android --clean

      - name: Patch build.gradle entryFile (monorepo fix)
        working-directory: apps/staff-app/android/app
        run: |
          # The shell command Expo generates for entryFile can return empty string in pnpm monorepos.
          # Replace it with a hardcoded reliable relative path.
          sed -i 's|entryFile = file(\["node", "-e", "require(.expo/scripts/resolveAppEntry.).*\]\.execute.*\.text\.trim())|entryFile = file("../../index.ts")|g' build.gradle
          echo "--- Patched entryFile line ---"
          grep "entryFile" build.gradle

      - name: Build Android Debug APK
        working-directory: apps/staff-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffApp-Debug-APK
          path: apps/staff-app/android/app/build/outputs/apk/debug/app-debug.apk
